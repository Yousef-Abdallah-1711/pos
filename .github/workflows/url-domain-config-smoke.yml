name: URL/Domain Config Smoke

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  url-domain-config-smoke:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.11"

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: backend/go.mod

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.22.3

      - name: Activate pinned pnpm
        run: corepack enable && corepack prepare pnpm@10.34.9 --activate

      - name: Install frontend dependencies
        run: pnpm --dir frontend install --frozen-lockfile

      - name: Run URL/domain config smoke checks
        run: python scripts/smoke_check_url_domain_config.py --skip-guardrail
