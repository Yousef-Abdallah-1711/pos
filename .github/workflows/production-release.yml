name: SERVIO automatic staging deployment
on:
  workflow_dispatch:
  workflow_run:
    workflows: [SERVIO verified CI]
    types: [completed]
permissions:
  contents: read
  actions: read
  packages: read
concurrency:
  group: servio-staging-deployment
  cancel-in-progress: false
jobs:
  probe-staging-network:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Check staging SSH reachability from the hosted runner
        run: python3 -c 'import socket; connection=socket.create_connection(("16.192.159.205",22),10); connection.close(); print("PASS hosted-runner SSH connectivity")'
  deploy-staging:
    if: >-
      github.repository == 'Yousef-Abdallah-1711/pos' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.event == 'push'
    environment: staging
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Verify current main and accepted CI identity
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(gh api "repos/$REPOSITORY/git/ref/heads/main" --jq .object.sha)" = "$RELEASE_SHA"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: release-manifest
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Deploy immutable staging release over verified SSH
        env:
          SERVIO_HOST: ${{ secrets.SERVIO_STAGING_HOST }}
          SERVIO_USER: ${{ secrets.SERVIO_STAGING_USER }}
          SERVIO_SSH_KEY: ${{ secrets.SERVIO_STAGING_SSH_KEY }}
          SERVIO_KNOWN_HOSTS: ${{ secrets.SERVIO_STAGING_KNOWN_HOSTS }}
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SERVIO_HOST" && test -n "$SERVIO_USER"
          test -n "$SERVIO_SSH_KEY" && test -n "$SERVIO_KNOWN_HOSTS"
          private_dir="$(mktemp -d)"
          trap 'rm -rf "$private_dir"' EXIT
          chmod 700 "$private_dir"
          printf '%s\n' "$SERVIO_SSH_KEY" > "$private_dir/key"
          printf '%s\n' "$SERVIO_KNOWN_HOSTS" > "$private_dir/known_hosts"
          chmod 600 "$private_dir/key" "$private_dir/known_hosts"
          python3 -c 'import json,os; d=json.load(open("release-manifest.json")); assert d["sha"] == os.environ["RELEASE_SHA"]; d.update(registry_user=os.environ["REGISTRY_USER"],registry_token=os.environ["REGISTRY_TOKEN"]); print(json.dumps(d))' |
            ssh -i "$private_dir/key" -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$private_dir/known_hosts" -o BatchMode=yes \
              "$SERVIO_USER@$SERVIO_HOST" "servio-deploy $RELEASE_SHA"
