name: SERVIO staging deployment verification
on:
  workflow_run:
    workflows: [SERVIO verified CI]
    types: [completed]
permissions:
  contents: read
concurrency:
  group: servio-staging-deployment
  cancel-in-progress: false
jobs:
  verify-outbound-deployment:
    if: >-
      github.repository == 'Yousef-Abdallah-1711/pos' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.event == 'push'
    environment: staging
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Verify the outbound agent deployed this exact accepted main release
        env:
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          python3 - <<'PY'
          import json,os,time,urllib.request
          expected=os.environ['RELEASE_SHA']
          for attempt in range(100):
              try:
                  with urllib.request.urlopen('https://api.pos.rakmyat.online/_ops/release',timeout=15) as response:
                      observed=json.load(response)
                  if observed.get('sha')==expected and observed.get('status')=='verified' and observed.get('environment')=='staging':
                      print('PASS outbound agent deployed verified main '+expected)
                      break
              except Exception:
                  pass
              time.sleep(15)
          else:
              raise SystemExit('BLOCKED: exact-main staging deployment was not verified before the bounded deadline; inspect the systemd agent journal')
          PY
