name: SERVIO staging deployment lockdown
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: servio-staging-deployment
  cancel-in-progress: false
jobs:
  deployment-locked:
    runs-on: ubuntu-24.04
    steps:
      - name: Keep staging deployment verification disabled
        run: echo 'Automatic staging deployment verification is disabled pending independently verified isolation.'
