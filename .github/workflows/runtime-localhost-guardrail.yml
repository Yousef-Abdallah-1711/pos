name: Runtime Localhost Guardrail

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  runtime-localhost-guardrail:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run runtime localhost guardrail
        run: python scripts/check_runtime_localhost.py
