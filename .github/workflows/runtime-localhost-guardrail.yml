name: Runtime Localhost Guardrail

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  runtime-localhost-guardrail:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.11"

      - name: Run runtime localhost guardrail
        run: python scripts/check_runtime_localhost.py
