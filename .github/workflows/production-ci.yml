name: SERVIO verified CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: servio-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres@sha256:fc41cfa8a90c09e84dd723ee764be4b2f59ba6c98b1e5b3fca540adddf68a5ba
        env:
          POSTGRES_PASSWORD: disposable-ci-only
          POSTGRES_DB: servio_test
        ports: [5432:5432]
        options: --health-cmd "pg_isready -U postgres -d servio_test" --health-interval 3s --health-timeout 3s --health-retries 20
      redis:
        image: redis@sha256:7f7d30b7fdd09467bac58198a1f166dd69789d348d4fe859cccb20e0cf287fbe
        ports: [6379:6379]
    env:
      GOMAXPROCS: '2'
      GOFLAGS: -p=2
      ENV: test
      DB_HOST: 127.0.0.1
      DB_PORT: '5432'
      DB_NAME: servio_test
      DB_USER: pos_migrator
      DB_PASSWORD: disposable-migrator-only
      DB_SSLMODE: disable
      POS_TEST_DATABASE_URL: postgres://postgres:disposable-ci-only@127.0.0.1:5432/servio_test?sslmode=disable
      POS_RLS_ADMIN_URL: postgres://postgres:disposable-ci-only@127.0.0.1:5432/servio_test?sslmode=disable
      POS_RLS_APP_URL: postgres://pos_app:disposable-app-only@127.0.0.1:5432/servio_test?sslmode=disable
      POS_APP_DATABASE_URL: postgres://pos_app:disposable-app-only@127.0.0.1:5432/servio_test?sslmode=disable
      POOS_SESSION_REDIS_URL: redis://127.0.0.1:6379/0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Initialize isolated database roles
        working-directory: backend
        env:
          PGPASSWORD: disposable-ci-only
        run: psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 -v dbname=servio_test -v migrator_pw=disposable-migrator-only -v app_pw=disposable-app-only -f scripts/db/create_runtime_roles.sql
      - run: go mod verify
        working-directory: backend
      - run: go fmt ./... && git diff --exit-code
        working-directory: backend
      - run: go run ./cmd/migrate
        working-directory: backend
      - run: go vet ./...
        working-directory: backend
      - run: go test -tags integration -count=1 -timeout 15m -json ./... > go-tests.jsonl
        working-directory: backend
      - run: go test -race ./internal/middleware ./cmd/migrate
        working-directory: backend
      - name: Audit reachable Go vulnerabilities
        working-directory: backend
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          govulncheck ./...
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: backend-test-results
          path: backend/go-tests.jsonl

  frontend:
    strategy:
      fail-fast: false
      matrix:
        app: [dashboard, landing, restaurant-website, super-admin]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CI: 'true'
      NODE_OPTIONS: --max-old-space-size=3072
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.22.3
      - run: corepack enable && corepack prepare pnpm@10.34.9 --activate
      - name: Locate pnpm content-addressed store
        id: store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ${{ steps.store.outputs.path }}
          key: ${{ runner.os }}-node24-pnpm10-${{ hashFiles('frontend/pnpm-lock.yaml') }}
      - run: pnpm install --frozen-lockfile
        working-directory: frontend
      - run: pnpm --filter "./apps/${{ matrix.app }}" lint
        working-directory: frontend
      - run: pnpm --filter "./apps/${{ matrix.app }}" typecheck
        working-directory: frontend
      - run: pnpm --filter "./apps/${{ matrix.app }}" typecheck:test
        working-directory: frontend
      - name: Unit and component tests
        working-directory: frontend
        env:
          APP: ${{ matrix.app }}
        run: |
          if [ "$APP" = restaurant-website ]; then
            pnpm --filter "./apps/$APP" exec jest --runInBand
          else
            pnpm --filter "./apps/$APP" test:run --maxWorkers=2 --no-file-parallelism
          fi

  security-and-config:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.22.3
      - run: corepack enable && corepack prepare pnpm@10.34.9 --activate
      - run: pnpm --dir frontend install --frozen-lockfile
      - name: Audit production dependencies (all severities)
        run: pnpm --dir frontend audit --prod
      - name: Audit development dependencies (high and critical gate; lower findings visible)
        run: pnpm --dir frontend audit --audit-level high
      - run: python3 scripts/check_runtime_localhost.py
      - run: scripts/production/check-compose-config.sh
      - run: scripts/production/check-nginx-template.sh
      - run: bash -n scripts/production/*.sh
      - run: python3 -m py_compile ops/aws/*.py
      - run: python3 -m unittest discover -s ops/aws -p 'test_*.py'
      - run: git diff --check

  application-images:
    permissions:
      contents: read
      packages: write
    needs: [backend, frontend, security-and-config]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Build all five immutable application images
        run: python3 ops/aws/build-ci-images.py
      - name: Chromium smoke against built frontend images
        run: ops/aws/ci-browser-smoke
      - name: Publish verified immutable images for trusted releases
        if: >-
          github.repository == 'Yousef-Abdallah-1711/pos' &&
          ((github.event_name == 'push' && github.ref == 'refs/heads/main') ||
           (github.event_name == 'workflow_dispatch' && github.actor == 'Yousef-Abdallah-1711'))
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 ops/aws/publish-ci-images.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: success() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        with:
          name: release-bundle
          path: release-bundle/
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: chromium-smoke-results
          path: |
            ops/aws/evidence/browser/results.json
            ops/aws/evidence/browser/storefront-browser-flow.json
            ops/aws/evidence/browser/upload-browser.json
          if-no-files-found: ignore

  required:
    if: always()
    needs: [backend, frontend, security-and-config, application-images]
    runs-on: ubuntu-24.04
    steps:
      - name: Require every validation stage
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: python3 -c 'import json,os; jobs=json.loads(os.environ["RESULTS"]); assert all(j["result"] == "success" for j in jobs.values()), jobs'

  publish-main-release:
    needs: [required]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'Yousef-Abdallah-1711/pos'
    environment: staging
    permissions:
      contents: write
      actions: read
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: release-bundle
          path: release-bundle
      - name: Sign and publish accepted main artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SERVIO_RELEASE_SIGNING_KEY: ${{ secrets.SERVIO_RELEASE_SIGNING_KEY }}
        run: python3 ops/aws/sign-publish-release.py
