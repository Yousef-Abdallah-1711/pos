name: SERVIO verified CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: servio-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres@sha256:e62fbf9d3e2b49816a32c400ed2dba83e3b361e6833e624024309c35d334b412
        env:
          POSTGRES_PASSWORD: disposable-ci-only
          POSTGRES_DB: servio_test
        ports: [5432:5432]
        options: --health-cmd "pg_isready -U postgres -d servio_test" --health-interval 3s --health-timeout 3s --health-retries 20
      redis:
        image: redis@sha256:02419de7eddf55aa5bcf49efb74e88fa8d931b4d77c07eff8a6b2144472b6952
        ports: [6379:6379]
    env:
      GOMAXPROCS: '2'
      # Integration packages share one disposable PostgreSQL database. Serialize
      # packages so durable outbox tests cannot claim another package's fixtures.
      GOFLAGS: -p=1
      ENV: test
      DB_HOST: 127.0.0.1
      DB_PORT: '5432'
      DB_NAME: servio_test
      DB_USER: pos_migrator
      DB_PASSWORD: disposable-migrator-only
      DB_SSLMODE: disable
      POS_TEST_DATABASE_URL: postgres://postgres:disposable-ci-only@127.0.0.1:5432/servio_test?sslmode=disable
      POS_RLS_ADMIN_URL: postgres://postgres:disposable-ci-only@127.0.0.1:5432/servio_test?sslmode=disable
      POS_RLS_APP_URL: postgres://pos_app:disposable-app-only@127.0.0.1:5432/servio_test?sslmode=disable
      POS_ACCOUNTING_DATABASE_URL: postgres://pos_accounting:disposable-accounting-only@127.0.0.1:5432/servio_test?sslmode=disable
      POS_APP_DATABASE_URL: postgres://pos_app:disposable-app-only@127.0.0.1:5432/servio_test?sslmode=disable
      POOS_SESSION_REDIS_URL: redis://127.0.0.1:6379/0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Initialize isolated database roles
        working-directory: backend
        env:
          PGPASSWORD: disposable-ci-only
        run: psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 -v dbname=servio_test -v migrator_pw=disposable-migrator-only -v app_pw=disposable-app-only -v accounting_pw=disposable-accounting-only -f scripts/db/create_runtime_roles.sql
      - run: go mod verify
        working-directory: backend
      - run: go fmt ./... && git diff --exit-code
        working-directory: backend
      - run: go run ./cmd/migrate
        working-directory: backend
      - run: go vet ./...
        working-directory: backend
      - run: go test -tags integration -count=1 -timeout 15m -json ./... > go-tests.jsonl
        working-directory: backend
      - run: go test -race ./internal/middleware ./cmd/migrate
        working-directory: backend
      - name: Audit reachable Go vulnerabilities
        working-directory: backend
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          govulncheck ./...
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: backend-test-results
          path: backend/go-tests.jsonl

  frontend:
    strategy:
      fail-fast: false
      matrix:
        app: [dashboard, landing, restaurant-website, super-admin]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CI: 'true'
      NODE_OPTIONS: --max-old-space-size=3072
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.22.3
      - run: corepack enable && corepack prepare pnpm@10.34.9 --activate
      - name: Locate pnpm content-addressed store
        id: store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ${{ steps.store.outputs.path }}
          key: ${{ runner.os }}-node24-pnpm10-${{ hashFiles('frontend/pnpm-lock.yaml') }}
      - run: pnpm install --frozen-lockfile
        working-directory: frontend
      - run: pnpm --filter "./apps/${{ matrix.app }}" lint
        working-directory: frontend
      - run: pnpm --filter "./apps/${{ matrix.app }}" typecheck
        working-directory: frontend
      - run: pnpm --filter "./apps/${{ matrix.app }}" typecheck:test
        working-directory: frontend
      - name: Unit and component tests
        working-directory: frontend
        env:
          APP: ${{ matrix.app }}
        run: |
          if [ "$APP" = restaurant-website ]; then
            pnpm --filter "./apps/$APP" exec jest --runInBand
          else
            pnpm --filter "./apps/$APP" test:run --maxWorkers=2 --no-file-parallelism
          fi

  auth-browser-acceptance:
    if: github.event_name == 'pull_request' && github.event.pull_request.number == 82
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      AUTH_TEST_PROJECT: servio-auth-gha-${{ github.run_id }}
      P2A_API_HOST_PORT: '18082'
      P2A_LANDING_HOST_PORT: '13115'
      P2A_DASHBOARD_HOST_PORT: '13116'
      P2A_RESTAURANT_HOST_PORT: '13117'
      P2A_SUPER_ADMIN_HOST_PORT: '13118'
      WS05_TEST_RUNNER_ON_HOST: 'true'
      WS05_COMPOSE_PROJECT: servio-auth-gha-${{ github.run_id }}
      WS05_API_HOST_PORT: '18082'
      WS05_API_URL: http://localhost:18082/api/v1
      WS05_API_INTERNAL_URL: http://localhost:18082/api/v1
      WS05_LANDING_URL: http://localhost:13111
      WS05_LANDING_REDIRECT_URL: http://localhost:13111
      WS05_DASHBOARD_URL: http://localhost:13112
      API_INTERNAL_URL: http://127.0.0.1:18082/api/v1
      NEXT_PUBLIC_API_URL: http://localhost:18082/api/v1
      NEXT_PUBLIC_API_BASE_URL: http://localhost:18082/api/v1
      NEXT_PUBLIC_SUPER_ADMIN_API_URL: http://localhost:18082/api/v1/super-admin
      NEXT_PUBLIC_LANDING_URL: http://localhost:13111
      NEXT_PUBLIC_DASHBOARD_URL: http://localhost:13112
      NEXT_PUBLIC_RESTAURANT_DOMAIN: localhost:13113
      NEXT_TELEMETRY_DISABLED: '1'
      NODE_OPTIONS: --max-old-space-size=3072
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.22.3
      - run: corepack enable && corepack prepare pnpm@10.34.9 --activate
      - name: Install only Landing, Dashboard, and their workspace dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile --filter @pos-saas/landing... --filter @pos-saas/dashboard...
      - name: Install Chromium and its host dependencies
        working-directory: frontend/apps/dashboard
        run: pnpm exec playwright install --with-deps chromium
      - name: Start the isolated API, PostgreSQL, and Redis
        run: docker compose -p "$AUTH_TEST_PROJECT" -f docker-compose.phase2a-e2e.yml up -d --build api
      - name: Wait for the isolated API health check
        run: |
          ready=false
          for attempt in $(seq 1 60); do
            if curl --fail --silent --max-time 5 http://127.0.0.1:18082/api/v1/health >/dev/null; then
              ready=true
              break
            fi
            sleep 5
          done
          test "$ready" = true
      - name: Seed synthetic WS05 tenant fixtures
        run: pwsh -NoProfile -NonInteractive -File scripts/phase2a-e2e/seed.ps1 -ProjectName "$AUTH_TEST_PROJECT"
      - name: Build production Landing and Dashboard, then run real Chromium authentication tests
        env:
          WS05_AUTH_EVIDENCE_DIR: ${{ runner.temp }}/auth-evidence
        run: |
          mkdir -p "$WS05_AUTH_EVIDENCE_DIR" "$RUNNER_TEMP/playwright-results"
          pnpm --dir frontend/apps/landing build
          pnpm --dir frontend/apps/dashboard build

          pnpm --dir frontend/apps/landing exec next start -p 13111 >"$RUNNER_TEMP/landing.log" 2>&1 &
          landing_pid=$!
          pnpm --dir frontend/apps/dashboard exec next start -p 13112 >"$RUNNER_TEMP/dashboard.log" 2>&1 &
          dashboard_pid=$!
          stop_frontends() {
            kill "$landing_pid" "$dashboard_pid" 2>/dev/null || true
            wait "$landing_pid" "$dashboard_pid" 2>/dev/null || true
          }
          trap stop_frontends EXIT

          for url in http://127.0.0.1:13111/en http://127.0.0.1:13112/en/dashboard; do
            ready=false
            for attempt in $(seq 1 60); do
              status=$(curl --silent --output /dev/null --write-out '%{http_code}' --max-time 5 "$url" || true)
              if [ "$status" = 200 ] || [[ "$status" =~ ^30[0-9]$ ]]; then
                ready=true
                break
              fi
              sleep 5
            done
            test "$ready" = true
          done

          pnpm --dir frontend/apps/dashboard exec playwright test \
            --config playwright.phase2a.config.ts \
            tests/phase2a-e2e/auth-lifecycle.spec.ts \
            --output "$RUNNER_TEMP/playwright-results" \
            --trace off
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: auth-browser-acceptance-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/playwright-results/
            ${{ runner.temp }}/auth-evidence/
          retention-days: 7
          if-no-files-found: warn
      - name: Remove only this run's disposable auth test project
        if: always()
        run: |
          if [[ "$AUTH_TEST_PROJECT" =~ ^servio-auth-gha-[0-9]+$ ]]; then
            docker compose -p "$AUTH_TEST_PROJECT" -f docker-compose.phase2a-e2e.yml down --volumes --remove-orphans
          else
            echo "Refusing cleanup because the auth test project name is unexpected."
            exit 1
          fi

  security-and-config:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.22.3
      - run: corepack enable && corepack prepare pnpm@10.34.9 --activate
      - run: pnpm --dir frontend install --frozen-lockfile
      - name: Validate EN/AR JSON dictionaries and report unused-key candidates
        env:
          I18N_REPORT_PATH: ${{ runner.temp }}/servio-i18n-unused-keys.report.json
        run: node frontend/scripts/validate-i18n.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: i18n-unused-key-report
          path: ${{ runner.temp }}/servio-i18n-unused-keys.report.json
          if-no-files-found: ignore
      - name: Audit production dependencies (all severities)
        run: pnpm --dir frontend audit --prod
      - name: Audit development dependencies (high and critical gate; lower findings visible)
        run: pnpm --dir frontend audit --audit-level high
      - run: python3 scripts/check_runtime_localhost.py
      - run: scripts/production/check-compose-config.sh
      - run: scripts/production/check-nginx-template.sh
      - run: bash -n scripts/production/*.sh
      - run: python3 -m py_compile ops/aws/*.py
      - run: python3 -m unittest discover -s ops/aws -p 'test_*.py'
      - run: node --test ops/aws/test_browser_route_inventory.cjs
      - name: Verify hardened service privilege drop
        run: python3 ops/aws/check-service-identity.py
      - run: git diff --check

  application-images:
    permissions:
      contents: read
    needs: [backend, frontend, security-and-config]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.22.3
      - name: Install browser dependencies on the isolated runner
        run: npm install --prefix "$RUNNER_TEMP/servio-browser" --ignore-scripts --no-audit --no-fund playwright@1.64.1 axe-core@4.11.0 lighthouse@13.6.0
      - name: Validate disposable acceptance target guards
        run: node --test ops/aws/test_acceptance-target.cjs
      - name: Validate acceptance runner boundary
        run: python3 ops/aws/test_ci_acceptance_isolation.py
      - name: Build all five immutable application images
        run: python3 ops/aws/build-ci-images.py
      - name: Chromium smoke against built frontend images
        env:
          SERVIO_CI_BROWSER_NODE_MODULES: ${{ runner.temp }}/servio-browser/node_modules
        run: ops/aws/ci-browser-smoke
      - name: Stage immutable release inputs for exact main CI
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: python3 ops/aws/stage-ci-images.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          name: release-image-input
          path: release-bundle/
          retention-days: 30
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: chromium-smoke-results
          path: |
            ops/aws/evidence/browser/run-metadata.json
            ops/aws/evidence/browser/results.json
            ops/aws/evidence/browser/*.png
            ops/aws/evidence/browser/raw-viewport/
            ops/aws/evidence/browser/device-frames/
            ops/aws/evidence/browser/storefront-browser-flow.json
            ops/aws/evidence/browser/upload-browser.json
            ops/aws/evidence/browser/journal-api-acceptance.json
            ops/aws/evidence/browser/auth-form-validation.json
            ops/aws/evidence/browser/marketing/
            ops/aws/evidence/browser/marketing-firefox/
            ops/aws/evidence/browser/marketing-chromium-light/
            ops/aws/evidence/browser/marketing-firefox-light/
            ops/aws/evidence/browser/marketing-chromium-dark/
            ops/aws/evidence/browser/marketing-firefox-dark/
            ops/aws/evidence/browser/trial-registration/
            ops/aws/evidence/browser/landing-regression/
            ops/aws/evidence/browser/lighthouse/
          if-no-files-found: ignore

  publish-release-images:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [application-images, required]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      actions: read
      checks: read
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
      - name: Download immutable image inputs from this CI run
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download "$GITHUB_RUN_ID" --name release-image-input --dir release-bundle
      - name: Publish image digests for exact main SHA
        env:
          GH_TOKEN: ${{ github.token }}
          GHCR_TOKEN: ${{ github.token }}
        run: python3 ops/aws/publish-ci-images.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-bundle
          path: release-bundle/
          retention-days: 30
          if-no-files-found: error

  required:
    if: always()
    needs: [backend, frontend, security-and-config, application-images, auth-browser-acceptance]
    runs-on: ubuntu-24.04
    env:
      REQUIRE_AUTH_BROWSER: ${{ github.event_name == 'pull_request' && github.event.pull_request.number == 82 }}
    steps:
      - name: Require every validation stage
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: python3 -c 'import json,os; jobs=json.loads(os.environ["RESULTS"]); run_browser=os.environ["REQUIRE_AUTH_BROWSER"] == "true"; required=[job for name,job in jobs.items() if name != "auth-browser-acceptance" or run_browser]; assert all(job["result"] == "success" for job in required), jobs'
