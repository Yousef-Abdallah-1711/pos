name: SERVIO financial query benchmark

on:
  pull_request:
    paths:
      - '.github/workflows/financial-benchmark.yml'
      - 'backend/cmd/api/financial_benchmark_integration_test.go'
      - 'backend/cmd/api/financial_benchmark_support_integration_test.go'
      - 'backend/internal/repository/accounting_*.go'
      - 'backend/internal/repository/general_ledger_*.go'
      - 'backend/internal/repository/inventory_movement_repo.go'
      - 'backend/internal/repository/journal_entry_repo.go'
      - 'backend/internal/usecase/financial_report*.go'
      - 'backend/internal/handler/http/financial_report*.go'
      - 'backend/internal/handler/http/accounting_advanced_handler.go'
      - 'backend/internal/handler/http/report_handler*.go'
      - 'backend/internal/handler/http/*export*.go'
      - 'backend/migrations/**'
      - 'backend/go.mod'
      - 'backend/go.sum'
  workflow_dispatch:
    inputs:
      journal_count:
        description: Synthetic balanced journal count
        required: true
        type: choice
        options: ['1000', '10000', '50000']
        default: '10000'

permissions:
  contents: read

concurrency:
  group: servio-financial-benchmark-${{ github.ref }}
  cancel-in-progress: false

jobs:
  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GOMAXPROCS: '2'
      GOFLAGS: -p=1
      ENV: test
      DB_HOST: 127.0.0.1
      DB_PORT: '5432'
      DB_NAME: servio_benchmark_test
      DB_USER: pos_migrator
      DB_SSLMODE: disable
      POS_FINANCIAL_BENCHMARK: '1'
      POS_FINANCIAL_BENCHMARK_JOURNALS: ${{ github.event.inputs.journal_count || '10000' }}
      POS_FINANCIAL_BENCHMARK_OUTPUT: ${{ github.workspace }}/audit-reports/financial-benchmark/financial-query-benchmark.json
      POS_FINANCIAL_BENCHMARK_EFFECTIVE_SHA: ${{ github.sha }}
      POS_FINANCIAL_BENCHMARK_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      POS_FINANCIAL_BENCHMARK_BASE_SHA: ${{ github.event.pull_request.base.sha || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Start disposable PostgreSQL with query statistics
        shell: bash
        run: |
          set -euo pipefail
          POSTGRES_PASSWORD="$(openssl rand -hex 32)"
          MIGRATOR_PASSWORD="$(openssl rand -hex 32)"
          APP_PASSWORD="$(openssl rand -hex 32)"
          ACCOUNTING_PASSWORD="$(openssl rand -hex 32)"
          for secret in "$POSTGRES_PASSWORD" "$MIGRATOR_PASSWORD" "$APP_PASSWORD" "$ACCOUNTING_PASSWORD"; do echo "::add-mask::$secret"; done
          docker run --detach --name servio-financial-benchmark-postgres \
            --publish 127.0.0.1:5432:5432 --memory 4g --shm-size 1g \
            --env POSTGRES_PASSWORD="$POSTGRES_PASSWORD" --env POSTGRES_DB=servio_benchmark_test \
            postgres@sha256:e62fbf9d3e2b49816a32c400ed2dba83e3b361e6833e624024309c35d334b412 \
            -c shared_preload_libraries=pg_stat_statements >/dev/null
          for attempt in $(seq 1 40); do
            if docker exec servio-financial-benchmark-postgres pg_isready -U postgres -d servio_benchmark_test >/dev/null 2>&1; then break; fi
            if [ "$(docker inspect --format '{{.State.Running}}' servio-financial-benchmark-postgres 2>/dev/null || true)" != true ]; then docker logs servio-financial-benchmark-postgres; exit 1; fi
            sleep 2
          done
          docker exec servio-financial-benchmark-postgres pg_isready -U postgres -d servio_benchmark_test
          {
            echo "POSTGRES_PASSWORD=$POSTGRES_PASSWORD"
            echo "DB_PASSWORD=$MIGRATOR_PASSWORD"
            echo "APP_PASSWORD=$APP_PASSWORD"
            echo "ACCOUNTING_PASSWORD=$ACCOUNTING_PASSWORD"
            echo "POS_TEST_DATABASE_URL=postgres://postgres:$POSTGRES_PASSWORD@127.0.0.1:5432/servio_benchmark_test?sslmode=disable"
          } >> "$GITHUB_ENV"
      - name: Create restricted database roles
        working-directory: backend
        run: PGPASSWORD="$POSTGRES_PASSWORD" psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 -v dbname=servio_benchmark_test -v migrator_pw="$DB_PASSWORD" -v app_pw="$APP_PASSWORD" -v accounting_pw="$ACCOUNTING_PASSWORD" -f scripts/db/create_runtime_roles.sql
      - name: Apply migrations to the disposable database
        working-directory: backend
        run: go run ./cmd/migrate
      - name: Execute PostgreSQL-backed financial benchmark
        working-directory: backend
        run: go test -tags integration -count=1 -timeout 35m ./cmd/api -run '^TestFinancialQueryBenchmarkIntegration$' -v
      - name: Publish sanitized synthetic benchmark summary
        if: always() && github.repository == 'Yousef-Abdallah-1711/pos'
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          report_path = Path(os.environ['GITHUB_WORKSPACE']) / 'audit-reports/financial-benchmark/financial-query-benchmark.json'
          summary_path = Path(os.environ['GITHUB_STEP_SUMMARY'])
          lines = ['## Synthetic financial query benchmark']
          if not report_path.is_file():
              lines.append('No benchmark report was produced; see the job result for the failure reason.')
          else:
              report = json.loads(report_path.read_text(encoding='utf-8'))
              dataset = report['dataset']
              lines.extend([
                  f"- Source head SHA: `{report['head_commit']}`",
                  f"- Effective SHA: `{report['effective_commit']}`",
                  f"- Dataset: {dataset['tenant_count']} tenants, {dataset['journal_entries']:,} journal entries, {dataset['journal_lines']:,} journal lines, {dataset['general_ledger_rows']:,} GL rows, {dataset['sales_orders']:,} orders.",
                  f"- Reconciliation: journal debits/credits {dataset['journal_debit_cents']:,}/{dataset['journal_credit_cents']:,} cents; GL debits/credits {dataset['general_ledger_debit_cents']:,}/{dataset['general_ledger_credit_cents']:,} cents.",
                  f"- Percentile method: {report['percentile_method_and_caveat']}.",
                  '- Approved production SLO thresholds: none supplied; results are descriptive and do not establish production capacity.',
                  '',
                  '| Operation | Samples | Concurrency | p50 ms | p95 ms | p99 ms | Max ms | Errors |',
                  '| --- | ---: | ---: | ---: | ---: | ---: | ---: | ---: |',
              ])
              for measurement in report['measurements']:
                  lines.append(
                      f"| {measurement['name']} | {measurement['samples']} | {measurement['concurrency']} | "
                      f"{measurement['p50_ms']:.3f} | {measurement['p95_ms']:.3f} | {measurement['p99_ms']:.3f} | "
                      f"{measurement['maximum_ms']:.3f} | {measurement['error_count']} |"
                  )
          with summary_path.open('a', encoding='utf-8') as summary:
              summary.write('\n'.join(lines) + '\n')
          PY
      - name: Upload benchmark report
        if: always() && github.repository == 'Yousef-Abdallah-1711/pos-phase5-private-acceptance'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: financial-query-benchmark-${{ github.sha }}-${{ github.event.inputs.journal_count || '10000' }}
          path: audit-reports/financial-benchmark/financial-query-benchmark.json
          if-no-files-found: warn
      - name: Destroy disposable PostgreSQL
        if: always()
        run: docker rm --force servio-financial-benchmark-postgres >/dev/null 2>&1 || true
