name: SERVIO financial acceptance

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: servio-financial-acceptance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  financial-postgres:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    services:
      postgres:
        image: postgres@sha256:e62fbf9d3e2b49816a32c400ed2dba83e3b361e6833e624024309c35d334b412
        env:
          POSTGRES_PASSWORD: disposable-ci-only
          POSTGRES_DB: servio_test
        ports: [5432:5432]
        options: --health-cmd "pg_isready -U postgres -d servio_test" --health-interval 3s --health-timeout 3s --health-retries 20
      redis:
        image: redis@sha256:02419de7eddf55aa5bcf49efb74e88fa8d931b4d77c07eff8a6b2144472b6952
        ports: [6379:6379]
        options: --health-cmd "redis-cli ping" --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      GOMAXPROCS: '2'
      GOFLAGS: -p=1
      ENV: test
      DB_HOST: 127.0.0.1
      DB_PORT: '5432'
      DB_NAME: servio_test
      DB_USER: pos_migrator
      DB_PASSWORD: disposable-migrator-only
      DB_SSLMODE: disable
      POS_TEST_DATABASE_URL: postgres://postgres:disposable-ci-only@127.0.0.1:5432/servio_test?sslmode=disable
      POS_RLS_ADMIN_URL: postgres://postgres:disposable-ci-only@127.0.0.1:5432/servio_test?sslmode=disable
      POS_RLS_APP_URL: postgres://pos_app:disposable-app-only@127.0.0.1:5432/servio_test?sslmode=disable
      POS_ACCOUNTING_DATABASE_URL: postgres://pos_accounting:disposable-accounting-only@127.0.0.1:5432/servio_test?sslmode=disable
      POS_APP_DATABASE_URL: postgres://pos_app:disposable-app-only@127.0.0.1:5432/servio_test?sslmode=disable
      POOS_SESSION_REDIS_URL: redis://127.0.0.1:6379/0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Initialize restricted disposable database roles
        working-directory: backend
        env:
          PGPASSWORD: disposable-ci-only
        run: psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 -v dbname=servio_test -v migrator_pw=disposable-migrator-only -v app_pw=disposable-app-only -v accounting_pw=disposable-accounting-only -f scripts/db/create_runtime_roles.sql
      - name: Apply latest-main migrations
        working-directory: backend
        run: go run ./cmd/migrate
      - name: Build the real API process
        working-directory: backend
        run: go build -o /tmp/servio-financial-api ./cmd/api
      - name: Start API with restricted application and accounting roles
        working-directory: backend
        env:
          DB_USER: pos_app
          DB_PASSWORD: disposable-app-only
          ACCOUNTING_DB_USER: pos_accounting
          ACCOUNTING_DB_PASSWORD: disposable-accounting-only
          PORT: '8080'
          JWT_SECRET: synthetic-financial-acceptance-signing-secret
          REDIS_URL: redis://127.0.0.1:6379/0
          PAYMOB_MODE: mock
          CORS_ORIGINS: http://localhost:3002
        shell: bash
        run: |
          set -euo pipefail
          nohup /tmp/servio-financial-api >/tmp/servio-financial-api.log 2>&1 &
          echo $! > /tmp/servio-financial-api.pid
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8080/api/v1/health/ready >/dev/null; then exit 0; fi
            sleep 2
          done
          cat /tmp/servio-financial-api.log
          exit 1
      - name: Exercise authenticated order-to-ledger workflow through the running API
        working-directory: backend
        env:
          POS_FINANCIAL_ACCEPTANCE_API_URL: http://127.0.0.1:8080
        run: go test -tags integration -count=1 -timeout 90s ./cmd/api -run '^TestFinancialAcceptanceLiveAPIOrderToLedger$' -v
      - name: Verify payment, auth, order, accounting, and reporting integration scenarios
        working-directory: backend
        run: |
          set -o pipefail
          go test -tags integration -count=1 -timeout 25m -json \
            ./internal/handler/http \
            ./internal/usecase \
            ./internal/repository \
            ./cmd/api | tee financial-acceptance-tests.jsonl
      - name: Upload financial acceptance test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: financial-acceptance-${{ github.sha }}
          path: backend/financial-acceptance-tests.jsonl
          if-no-files-found: warn
      - name: Stop the API process
        if: always()
        shell: bash
        run: |
          if [ -f /tmp/servio-financial-api.pid ]; then
            kill "$(cat /tmp/servio-financial-api.pid)" 2>/dev/null || true
          fi
