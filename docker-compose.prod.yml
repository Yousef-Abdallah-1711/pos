name: rakmyat-pos-production

# Runtime-only production stack. Images are built and tested in GitHub Actions;
# IMAGE_TAG must be the immutable sha-<40-character-commit> tag.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-backend-environment: &backend-environment
  PORT: "8080"
  ENV: production
  DB_HOST: postgres
  DB_PORT: "5432"
  DB_NAME: ${DB_NAME:-pos_saas}
  DB_SSLMODE: disable
  DB_MAX_OPEN_CONNS: ${DB_MAX_OPEN_CONNS:-20}
  DB_MAX_IDLE_CONNS: ${DB_MAX_IDLE_CONNS:-5}
  DB_CONN_MAX_IDLE_TIME: ${DB_CONN_MAX_IDLE_TIME:-2m}
  DB_CONN_MAX_LIFETIME: ${DB_CONN_MAX_LIFETIME:-5m}
  JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
  JWT_EXPIRY: ${JWT_EXPIRY:-24h}
  LOG_LEVEL: ${LOG_LEVEL:-info}
  RBAC_ENFORCEMENT: enforce
  CORS_ORIGINS: ${CORS_ORIGINS:?set CORS_ORIGINS}
  APP_BASE_URL: ${PUBLIC_API_URL:?set PUBLIC_API_URL}
  DASHBOARD_URL: ${DASHBOARD_URL:?set DASHBOARD_URL}
  LANDING_URL: ${LANDING_URL:?set LANDING_URL}
  RESTAURANT_DOMAIN: ${RESTAURANT_DOMAIN:?set RESTAURANT_DOMAIN}
  UPLOAD_BASE_URL: ${PUBLIC_API_URL}/uploads
  WEBHOOK_BASE_URL: ${PUBLIC_API_URL}
  PAYMOB_MODE: ${PAYMOB_MODE:-live}
  PAYMOB_API_KEY: ${PAYMOB_API_KEY:-}
  PAYMOB_INTEGRATION_ID: ${PAYMOB_INTEGRATION_ID:-}
  PAYMOB_IFRAME_ID: ${PAYMOB_IFRAME_ID:-}
  PAYMOB_HMAC_SECRET: ${PAYMOB_HMAC_SECRET:-}
  PAYMOB_BASE_URL: ${PAYMOB_BASE_URL:-https://accept.paymob.com/api}

x-frontend-common: &frontend-common
  restart: unless-stopped
  init: true
  stop_grace_period: 20s
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  logging: *logging
  mem_limit: 512m
  cpus: 0.5
  networks:
    - app
  depends_on:
    backend:
      condition: service_healthy
  healthcheck:
    test:
      - CMD
      - node
      - -e
      - "fetch('http://127.0.0.1:3000').then((response) => process.exit(response.status < 500 ? 0 : 1)).catch(() => process.exit(1))"
    interval: 30s
    timeout: 5s
    retries: 3
    start_period: 45s

services:
  postgres:
    image: postgres:15.19-alpine3.24@sha256:eab009ce9447a891d9482702d370bbf132c18563bb87cfdcc2b815c6d3b0372f
    command:
      - postgres
      - -c
      - max_connections=80
      - -c
      - password_encryption=scram-sha-256
    environment:
      POSTGRES_USER: ${DB_BOOTSTRAP_USER:-pos_bootstrap}
      POSTGRES_PASSWORD: ${DB_BOOTSTRAP_PASSWORD:?set DB_BOOTSTRAP_PASSWORD}
      POSTGRES_DB: ${DB_NAME:-pos_saas}
      POS_MIGRATOR_PASSWORD: ${MIGRATE_DB_PASSWORD:?set MIGRATE_DB_PASSWORD}
      POS_APP_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/scripts/db/create_runtime_roles.sql:/pos/create_runtime_roles.sql:ro
      - ./backend/scripts/db/init-runtime-roles.sh:/docker-entrypoint-initdb.d/10-init-runtime-roles.sh:ro
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    restart: unless-stopped
    stop_grace_period: 60s
    mem_limit: 2g
    cpus: 1.5
    logging: *logging
    networks:
      - database

  redis:
    image: redis:7.2.17-alpine3.22@sha256:2f66de68111e64c3927859f158f8e666066dae2b97d9f82770a6f37a5aa1c335
    entrypoint: [/bin/sh, -ec]
    command:
      - 'umask 077; printf "requirepass %s\nappendonly yes\nappendfsync everysec\nsave 60 1000\nmaxmemory 256mb\nmaxmemory-policy noeviction\n" "$$(cat /run/secrets/redis_password)" > /tmp/redis.conf; exec redis-server /tmp/redis.conf'
    secrets:
      - redis_password
    group_add:
      - "19990"
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    volumes:
      - redis_data:/data
    healthcheck:
      test: [CMD-SHELL, "REDISCLI_AUTH=\"$$(cat /run/secrets/redis_password)\" redis-cli ping | grep -qx PONG"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    restart: unless-stopped
    stop_grace_period: 30s
    mem_limit: 384m
    cpus: 0.5
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging: *logging
    networks:
      - cache

  migrate:
    image: ${IMAGE_REGISTRY:?set IMAGE_REGISTRY}/api:${IMAGE_TAG:?set immutable IMAGE_TAG}
    entrypoint: ["/app/docker-entrypoint.sh"]
    command: ["migrate"]
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME:-pos_saas}
      DB_SSLMODE: disable
      DB_USER: pos_migrator
      DB_PASSWORD: ${MIGRATE_DB_PASSWORD:?set MIGRATE_DB_PASSWORD}
      MIGRATE_DB_USER: pos_migrator
      MIGRATE_DB_PASSWORD: ${MIGRATE_DB_PASSWORD:?set MIGRATE_DB_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    init: true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 512m
    cpus: 0.75
    logging: *logging
    networks:
      - database

  backend:
    image: ${IMAGE_REGISTRY:?set IMAGE_REGISTRY}/api:${IMAGE_TAG:?set immutable IMAGE_TAG}
    entrypoint: ["/app/docker-entrypoint.sh"]
    command: ["api"]
    secrets:
      - redis_password
    group_add:
      - "19990"
    environment:
      <<: *backend-environment
      DB_USER: pos_app
      DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD}
    ports:
      - "127.0.0.1:${API_HOST_PORT:-13405}:8080"
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: [CMD, curl, --fail, --silent, http://127.0.0.1:8080/api/v1/health]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    init: true
    stop_grace_period: 45s
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 1g
    cpus: 1.0
    logging: *logging
    networks:
      - app
      - database
      - cache

  landing:
    <<: *frontend-common
    image: ${IMAGE_REGISTRY:?set IMAGE_REGISTRY}/landing:${IMAGE_TAG:?set immutable IMAGE_TAG}
    ports:
      - "127.0.0.1:${LANDING_HOST_PORT:-13401}:3000"

  dashboard:
    <<: *frontend-common
    image: ${IMAGE_REGISTRY:?set IMAGE_REGISTRY}/dashboard:${IMAGE_TAG:?set immutable IMAGE_TAG}
    ports:
      - "127.0.0.1:${DASHBOARD_HOST_PORT:-13402}:3000"

  restaurant-website:
    <<: *frontend-common
    image: ${IMAGE_REGISTRY:?set IMAGE_REGISTRY}/restaurant-website:${IMAGE_TAG:?set immutable IMAGE_TAG}
    ports:
      - "127.0.0.1:${RESTAURANT_HOST_PORT:-13403}:3000"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000', {headers: {host: 'healthcheck.restaurants.pos.rakmyat.online'}}).then((response) => process.exit(response.status < 500 ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 45s

  super-admin:
    <<: *frontend-common
    image: ${IMAGE_REGISTRY:?set IMAGE_REGISTRY}/super-admin:${IMAGE_TAG:?set immutable IMAGE_TAG}
    ports:
      - "127.0.0.1:${SUPER_ADMIN_HOST_PORT:-13404}:3000"

networks:
  app:
    name: rakmyat-pos-production-app
  database:
    name: rakmyat-pos-production-database
    internal: true
  cache:
    name: rakmyat-pos-production-cache
    internal: true

volumes:
  postgres_data:
    name: rakmyat-pos-production-postgres
  redis_data:
    name: rakmyat-pos-production-redis
  uploads_data:
    name: rakmyat-pos-production-uploads

secrets:
  redis_password:
    file: ${REDIS_PASSWORD_FILE:-/etc/rakmyat-pos/redis-password}
