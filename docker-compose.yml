name: pos-dev

# DEVELOPMENT stack: Postgres + Go API + all four Next.js apps with hot reload.
#   docker compose up --build
# For the production stack see docker-compose.prod.yml.
#
# The frontend containers share the backend container's network namespace, so
# "localhost:8080" inside a frontend container (SSR requests) reaches the API,
# exactly like it does in the browser. That is why the app ports are published
# on the backend service.

x-frontend: &frontend
  build:
    context: ./frontend
    dockerfile: Dockerfile.dev
  working_dir: /app
  network_mode: "service:backend"
  depends_on:
    frontend-install:
      condition: service_completed_successfully
    backend:
      condition: service_started
  volumes: &frontend-volumes
    - ./frontend:/app
    - pnpm_store:/pnpm-store
    - node_modules_root:/app/node_modules
    - node_modules_dashboard:/app/apps/dashboard/node_modules
    - node_modules_landing:/app/apps/landing/node_modules
    - node_modules_restaurant:/app/apps/restaurant-website/node_modules
    - node_modules_super_admin:/app/apps/super-admin/node_modules
    - node_modules_pkg_theme:/app/packages/theme/node_modules
    - node_modules_pkg_ui:/app/packages/ui/node_modules
    - node_modules_pkg_ui_components:/app/packages/ui-components/node_modules
    - node_modules_layer_shared:/app/layers/shared-components/node_modules
    - node_modules_layer_themes:/app/layers/ui-themes/node_modules
    - next_dashboard:/app/apps/dashboard/.next
    - next_landing:/app/apps/landing/.next
    - next_restaurant:/app/apps/restaurant-website/.next
    - next_super_admin:/app/apps/super-admin/.next
  environment: &frontend-env
    NODE_ENV: development
    NEXT_PUBLIC_API_URL: http://localhost:8080/api/v1
    NEXT_PUBLIC_API_BASE_URL: http://localhost:8080/api/v1
    NEXT_PUBLIC_SUPER_ADMIN_API_URL: http://localhost:8080/api/v1/super-admin
    NEXT_PUBLIC_LANDING_URL: http://localhost:3001
    NEXT_PUBLIC_DASHBOARD_URL: http://localhost:3002
    NEXT_PUBLIC_RESTAURANT_DOMAIN: localhost:3003
  restart: unless-stopped

services:
  postgres:
    image: postgres:15-alpine
    container_name: pos-postgres
    command: ["postgres", "-c", "max_connections=200"]
    hostname: postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: pos_saas
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - pos-network
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    image: pos-backend:dev
    container_name: pos-backend
    hostname: backend
    environment:
      PORT: 8080
      ENV: development
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: pos_saas
      DB_SSLMODE: disable
      JWT_SECRET: dev-only-jwt-secret-change-me
      JWT_EXPIRY: 24h
      LOG_LEVEL: debug
      CORS_ORIGINS: http://localhost:3001,http://localhost:3002,http://localhost:3003,http://localhost:3004,http://demo.localhost:3003
      APP_BASE_URL: http://localhost:8080
      DASHBOARD_URL: http://localhost:3002
      LANDING_URL: http://localhost:3001
      RESTAURANT_DOMAIN: localhost:3003
      UPLOAD_BASE_URL: http://localhost:8080/uploads
      WEBHOOK_BASE_URL: http://localhost:8080
    ports:
      - "8080:8080"
      # Frontend apps (they share this container's network namespace)
      - "3001:3001"
      - "3002:3002"
      - "3003:3003"
      - "3004:3004"
    volumes:
      - ./backend:/app
      - go_mod_cache:/go/pkg/mod
      - go_build_cache:/root/.cache/go-build
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - pos-network
    restart: unless-stopped

  # One-shot: installs workspace dependencies into the shared volumes.
  frontend-install:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    working_dir: /app
    command: sh -c "pnpm config set store-dir /pnpm-store && pnpm install --frozen-lockfile"
    volumes: *frontend-volumes
    environment:
      CI: "true"
    networks:
      - pos-network

  landing:
    <<: *frontend
    container_name: pos-landing
    command: pnpm --filter @pos-saas/landing dev

  dashboard:
    <<: *frontend
    container_name: pos-dashboard
    command: pnpm --filter @pos-saas/dashboard dev

  restaurant-website:
    <<: *frontend
    container_name: pos-restaurant-website
    command: pnpm --filter @pos-saas/restaurant-website dev

  super-admin:
    <<: *frontend
    container_name: pos-super-admin
    command: pnpm --filter @pos-saas/super-admin dev

networks:
  pos-network:
    driver: bridge

volumes:
  postgres_data:
  go_mod_cache:
  go_build_cache:
  pnpm_store:
  node_modules_root:
  node_modules_dashboard:
  node_modules_landing:
  node_modules_restaurant:
  node_modules_super_admin:
  node_modules_pkg_theme:
  node_modules_pkg_ui:
  node_modules_pkg_ui_components:
  node_modules_layer_shared:
  node_modules_layer_themes:
  next_dashboard:
  next_landing:
  next_restaurant:
  next_super_admin:
